name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build and test JVM, JS and Linux Native
        run: ./gradlew build --console=plain
      - name: Upload libraries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Package
          path: build/libs
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Unit Test Results
          path: build/test-results/**/*.xml
